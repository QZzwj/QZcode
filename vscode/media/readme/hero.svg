<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="qz-hero-title qz-hero-desc">
  <title id="qz-hero-title">QZcode — VS Code 里的四角色接力编码流水线</title>
  <desc id="qz-hero-desc">左侧是项目名与一句话说明；右侧是四角色接力示意：L 判断怎么走，A 出任务书，B 带工具实现，C 只读核验，末端是真实的工具调用、文件改动与通过结论。</desc>

  <defs>
    <linearGradient id="qz-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b111f"/>
      <stop offset="1" stop-color="#131c2d"/>
    </linearGradient>
    <linearGradient id="qz-relay" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#67a7ff"/>
      <stop offset="1" stop-color="#56cea1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#qz-bg)"/>
  <rect x="1" y="1" width="1198" height="378" rx="23" fill="none" stroke="#27354d"/>

  <!-- 左侧：身份 + 一句话 -->
  <g id="title-block">
    <text x="64" y="84" font-family="Consolas, 'Cascadia Code', Menlo, monospace" font-size="19" fill="#8b9db8">VS CODE 扩展 · 四角色接力</text>
    <text x="62" y="158" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="64" font-weight="700" fill="#eef4ff">QZcode</text>
    <text x="64" y="212" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="23" fill="#c8d6ea">一句话目标，四个模型接力做成改动。</text>
    <text x="64" y="248" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="23" fill="#c8d6ea">不通过就退回重写，最多 3 轮。</text>

    <g id="metadata">
      <rect x="64" y="288" width="196" height="38" rx="19" fill="#16243a" stroke="#2f4463"/>
      <text x="82" y="313" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="18" fill="#9fb6d6">自带后端</text>

      <rect x="272" y="288" width="196" height="38" rx="19" fill="#16243a" stroke="#2f4463"/>
      <text x="290" y="313" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="18" fill="#9fb6d6">不需要装 Node</text>

      <rect x="480" y="288" width="176" height="38" rx="19" fill="#16243a" stroke="#2f4463"/>
      <text x="498" y="313" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="18" fill="#9fb6d6">侧栏里跑完</text>
    </g>
  </g>

  <!-- 右侧：真实材料的接力示意 -->
  <g id="project-proof" transform="translate(700 56)">
    <rect x="0" y="0" width="440" height="268" rx="18" fill="#0e1626" stroke="#2b3d59"/>

    <!-- 接力带 -->
    <line x1="42" y1="52" x2="398" y2="52" stroke="url(#qz-relay)" stroke-width="3" stroke-linecap="round"/>
    <g font-family="Consolas, 'Cascadia Code', Menlo, monospace" font-size="20" font-weight="700" text-anchor="middle">
      <circle cx="42" cy="52" r="19" fill="#22375c" stroke="#67a7ff" stroke-width="2"/>
      <text x="42" y="60" fill="#bcd8ff">L</text>
      <circle cx="160" cy="52" r="19" fill="#2b2440" stroke="#b48ef0" stroke-width="2"/>
      <text x="160" y="60" fill="#dcc9ff">A</text>
      <circle cx="278" cy="52" r="19" fill="#16362f" stroke="#56cea1" stroke-width="2"/>
      <text x="278" y="60" fill="#a8e8cb">B</text>
      <circle cx="398" cy="52" r="19" fill="#3a3020" stroke="#e8b45c" stroke-width="2"/>
      <text x="398" y="60" fill="#f5d9a3">C</text>
    </g>
    <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="18" fill="#7f93b0" text-anchor="middle">
      <text x="42" y="94">分流</text>
      <text x="160" y="94">任务书</text>
      <text x="278" y="94">实现</text>
      <text x="398" y="94">核验</text>
    </g>

    <!-- 真实工具行 -->
    <g id="tool-row">
      <rect x="20" y="118" width="400" height="42" rx="10" fill="#131e31" stroke="#2b3d59"/>
      <circle cx="42" cy="139" r="5" fill="#56cea1"/>
      <text x="58" y="146" font-family="Consolas, 'Cascadia Code', Menlo, monospace" font-size="18" fill="#a8e8cb">write</text>
      <text x="126" y="146" font-family="Consolas, 'Cascadia Code', Menlo, monospace" font-size="18" fill="#dbe6f7">OK</text>
      <text x="164" y="146" font-family="Consolas, 'Cascadia Code', Menlo, monospace" font-size="18" fill="#7f93b0">96ms</text>
      <text x="234" y="146" font-family="Consolas, 'Cascadia Code', Menlo, monospace" font-size="18" fill="#dbe6f7">index.html</text>
    </g>

    <!-- 真实改动行 -->
    <g id="patch-row">
      <rect x="20" y="172" width="400" height="42" rx="10" fill="#131e31" stroke="#2b3d59"/>
      <text x="40" y="200" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="18" fill="#dbe6f7">修改 index.html</text>
      <text x="232" y="200" font-family="Consolas, 'Cascadia Code', Menlo, monospace" font-size="18" fill="#6ddba8">+42</text>
      <text x="286" y="200" font-family="Consolas, 'Cascadia Code', Menlo, monospace" font-size="18" fill="#f3828a">−0</text>
      <text x="348" y="200" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="18" fill="#7f93b0">展开</text>
    </g>

    <!-- 真实结论 -->
    <g id="verdict-row">
      <line x1="20" y1="242" x2="180" y2="242" stroke="#2b3d59" stroke-width="2"/>
      <line x1="260" y1="242" x2="420" y2="242" stroke="#2b3d59" stroke-width="2"/>
      <rect x="188" y="222" width="64" height="40" rx="20" fill="#143a32" stroke="#34795f"/>
      <path d="M206 242l7 7 13-15" fill="none" stroke="#8ae9c1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="262" y="249" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600" fill="#a8e8cb">通过</text>
    </g>
  </g>
</svg>
